# ws — paths, traps, pre-push checklist

root: .
crate_root: crates/audio_api
toolchain: stable-rust + gcc|msvc

# === PRE-PUSH CHECKLIST (obrigatório) ===
# Roda os MESMOS checks do CI (ci-rust.yml lint job):
#   cargo fmt --all --check
#   cargo clippy --workspace --all-targets -- -D warnings
#   cargo build --workspace
#   cargo test --workspace (PROPTEST_CASES=100)
#
# Shortcut: . .dev/DevHelper.ps1; Test-CI

# === TRAPS (do NOT repeat) ===
traps:
  - CI fmt --check fails: cargo fmt --all BEFORE commit
  - CI clippy -D warnings: use --all-targets (catches tests+examples)
  - CI test_docs_05_table_matches_registry: #[ignore] (pre-existing UTF-8 encoding bug across OS)
  - CI matrix macos/ubuntu/windows may fail: pre-existing CI infra issue, not your code
  - Set-Content adds BOM: use Write-RustFile always
  - Literal \n in sed/PowerShell replace: use Write-RustFile or [System.IO.File]::WriteAllText
  - DSP edges (0, NaN, empty): test borders always
  - dead_code in infra modules: add #![allow(dead_code)] until integrated

# === PATHS ===
paths:
  dsp: crates/audio_core/src/dsp
  domain: crates/audio_core/src/domain
  agent: crates/audio_agent/src
  api: crates/audio_api/src
  ui: ui/src

# === SHORTCUTS ===
shortcuts:
  ci: . .dev/DevHelper.ps1; Test-CI
  fmt: cargo fmt --all
  clippy: cargo clippy --workspace --all-targets -- -D warnings
  build: cargo build --workspace
  test: cargo test --workspace

# === DOCS ===
docs:
  dsp: docs/04-DOMINIO-DSP.md
  agent: docs/05-AGENTE-IA-HITL.md
  contracts: docs/03-CONTRATOS-API.md
  tests: docs/10-TESTES-QUALIDADE.md
  ci: .github/workflows/ci-rust.yml