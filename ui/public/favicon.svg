<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Favicon do Mixlirous — waveform estilizado representando áudio.
       Cores: usa os tokens da marca (ver ui/src/scripts/lint-colors.mjs).
       SVG em vez de ICO: escala sem perda, suporta dark mode via CSS. -->
