name: Rust CI

on:
  pull_request:
    paths: ["crates/**", "Cargo.*", "config/**"]
  push:
    branches: [main]
    paths: ["crates/**", "Cargo.*", "config/**"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

  build_and_test:
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Build workspace
        run: cargo build --workspace

      - name: Run tests
        run: cargo test --workspace -- --nocapture

  security_scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: cargo-audit

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # RUSTSEC-2023-0071 ("Marvin Attack", crate `rsa`): chega transitivamente
      # via jsonwebtoken/rust_crypto, que empacota RSA+EC+HMAC juntos sem
      # granularidade por algoritmo — não existe feature "só HMAC". Este
      # projeto só emite/valida HS256 (segredo simétrico, ver
      # crates/audio_api/src/middleware/auth.rs); o código RSA nunca é
      # exercitado. Não há correção disponível upstream ainda (o próprio
      # advisory diz isso). Reavaliar quando existir patch ou quando
      # jsonwebtoken permitir excluir `rsa` do backend rust_crypto.
      - name: cargo audit
        run: cargo audit --ignore RUSTSEC-2023-0071
