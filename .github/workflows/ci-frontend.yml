name: Frontend CI

on:
  pull_request:
    paths: ["ui/**"]
  push:
    branches: [main]
    paths: ["ui/**"]

defaults:
  run:
    working-directory: ui

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
