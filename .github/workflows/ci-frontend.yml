name: Frontend CI

# Roda INCONDICIONALMENTE em todo PR e em todo push para main (issue #5):
# sem `paths:`, nenhum PR escapa do gate de lint/build do frontend — o gate
# só é confiável se rodar sempre, não só quando os paths batem.
on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    working-directory: ui

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
