name: Prompt Linter

on:
  pull_request:
    paths: ["prompts/**", "scripts/prompt_linter.py"]
  push:
    branches: [main]
    paths: ["prompts/**", "scripts/prompt_linter.py"]

jobs:
  lint_prompts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate prompt schemas
        run: python scripts/prompt_linter.py prompts/catalog.json
