name: Docker Build

# Builda a imagem em PR e em push para main. `cargo build` passar não
# garante que o Dockerfile builda (estágio errado, COPY de artefato que não
# existe, base image quebrada — tudo isso só falha dentro do Docker). Rodar
# em PR também detecta isso antes do merge, não depois, na main.
# `paths:` mantém o custo zero em PRs que não tocam nada relevante pra imagem.
on:
  pull_request:
    paths: ["crates/**", "Cargo.*", "config/**", "prompts/**", "Dockerfile"]
  push:
    branches: [main]
    paths: ["crates/**", "Cargo.*", "config/**", "prompts/**", "Dockerfile"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t mixlirous-api:${{ github.sha }} .

      - name: Smoke test /healthz
        run: |
          docker run -d --name smoke -p 8080:8080 -e CONFIG_ENV=local mixlirous-api:${{ github.sha }}
          for i in $(seq 1 10); do
            if curl -sf localhost:8080/healthz; then exit 0; fi
            sleep 1
          done
          docker logs smoke
          exit 1
