[package]
name = "audio_api"
version = "0.1.0"
edition = "2021"

[dependencies]
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
async-trait.workspace = true

audio_core = { path = "../audio_core" }
audio_agent = { path = "../audio_agent" }

# `multipart` n├úo ├® feature default e ├® o que a rota de diagn├│stico usa para
# receber o upload de ├íudio (routes/dev_slice.rs).
axum = { version = "0.8.9", features = ["multipart"] }
tokio = { version = "1.53", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3.23"
config = "0.14.1"
serde_yaml = "0.9.34"
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["rust_crypto"] }
futures = "0.3.33"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "uuid", "chrono] }
