  - { metodo: GET,  caminho: /api/v1/tracks/{track_id}/peaks, auth: "local-session", proposito: "peaks para waveform" }
  - { metodo: GET,  caminho: /api/v1/tracks/{track_id}/raw,   auth: "local-session", proposito: "áudio original" }

rotas_diagnostico_desligadas:
  condicao: "MIXLIROUS_DEV_SLICE=1 E CONFIG_ENV != production"
  aviso: "nunca expor sem auth_basic (docs/18-DEPLOY-PUBLICO-NGINX.md)"
  rotas:
    - { metodo: "GET/POST", caminho: /api/v1/dev/slice }
    - { metodo: GET, caminho: /api/v1/dev/slice/{id} }
