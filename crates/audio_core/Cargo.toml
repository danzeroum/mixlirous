[package]
name = "audio_core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
thiserror.workspace = true
async-trait.workspace = true
chrono.workspace = true
# Formatos aceitos na entrada (docs/14-AUDITORIA-KIT.md C-symphonia). `wav`,
# `flac` e `pcm` já vêm nas features default da 0.6 — ficam listados mesmo
# assim porque são requisito de produto, não conveniência: sem isso, alguém
# que adicionasse `default-features = false` derrubaria formatos aceitos sem
# perceber. `aiff` não é default e precisa ser pedido: está na especificação
# de entrada junto com WAV, FLAC e MP3.
symphonia = { version = "0.6.0", features = [
    "wav",
    "flac",
    "aiff",
    "mp3",
    "aac",
    "isomp4",
] }
ndarray = "0.17.2"
# Fixadas em versão exata (docs/16 T1.1): estas quatro implementam a
# matemática de DSP em si (FFT, loudness, resampling), não infraestrutura de
# decodificação/array genérica — o rubato publicou quatro versões maiores em
# sete meses, e a Sprint 0 já perdeu tempo com uma API que mudou embaixo.
# Atualização destas quatro é tarefa agendada, com escuta, não efeito
# colateral de `cargo update`.
realfft = "=3.5.0"
ebur128 = "=0.1.10"
rubato = "=4.0.0"
audioadapter-buffers = "=4.0.0"
# Movida de dev-dependencies: `DefaultMixer::export_wav` (default_mixer.rs)
# agora escreve WAV de verdade, não só os testes de fixture leem com isto.
hound = "3.5"

[dev-dependencies]
proptest = "1"
sha2 = "0.10"
